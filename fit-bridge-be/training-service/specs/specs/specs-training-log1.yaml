openapi: 3.0.4
info:
  title: Training Service log models
  description: Log models for logging services of training-service
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
paths: {}

components:
  schemas:
    CommonLogModel:
      title: Общая модель лога
      description: Общая модель лога для всех микросервисов системы
      type: object
      properties:
        messageTime:
          type: string
        logId:
          type: string
        source:
          type: string
        training:
          $ref: '#/components/schemas/TrainingLogModel'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorLogModel'

    TrainingLogModel:
      title: Модель лога для микросервиса Training
      type: object
      properties:
        requestId:
          type: string
        operation:
          $ref: '#/components/schemas/TrainingLogOperation'
        requestClientCard:
          $ref: '#/components/schemas/ClientCardLog'
        requestTrainingPlan:
          $ref: '#/components/schemas/TrainingPlanLog'
        requestFilter:
          $ref: '#/components/schemas/TrainingFilterLog'
        responseClientCard:
          $ref: '#/components/schemas/ClientCardLog'
        responseTrainingPlan:
          $ref: '#/components/schemas/TrainingPlanLog'
        responseClientCards:
          type: array
          items:
            $ref: '#/components/schemas/ClientCardLog'
        responseTrainingPlans:
          type: array
          items:
            $ref: '#/components/schemas/TrainingPlanLog'

    TrainingLogOperation:
      type: string
      enum:
        - create
        - read
        - update
        - archive
        - search
        - init
        - finish

    ErrorLogModel:
      title: Модель лога для ошибки
      type: object
      properties:
        message:
          type: string
        field:
          type: string
        code:
          type: string
        level:
          type: string

    ClientCardLog:
      title: Модель лога для карточки клиента
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        ownerUserId:
          type: string
        createdByUserId:
          type: string
        goals:
          type: string
        medicalConditions:
          type: string

    TrainingPlanLog:
      title: Модель лога для плана тренировок
      type: object
      properties:
        id:
          type: string
        cardId:
          type: string
        ownerUserId:
          type: string
        createdByUserId:
          type: string
        title:
          type: string
        durationDays:
          type: integer
        intensity:
          type: string

    TrainingFilterLog:
      title: Модель лога фильтра
      properties:
        searchString:
          type: string
        clientId:
          type: string
        ownerUserId:
          type: string
        cardId:
          type: string
