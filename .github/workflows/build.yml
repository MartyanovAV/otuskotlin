# This is a basic workflow to help you get started with Actions

name: 'CI-build'

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - 'main'
      - 'master'
      - 'v-*'
      - 'release/*'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle from Properties File
        uses: gradle/actions/setup-gradle@v5

      - name: Build stack and run E2E tests
        run: bash ./scripts/run-e2e.sh

      - name: Show Compose logs after failure
        if: failure()
        run: docker compose --file deploy/docker-compose.yml logs --no-color --tail 200 || true
