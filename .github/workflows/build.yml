# This is a basic workflow to help you get started with Actions

name: 'CI-build'

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - 'main'
      - 'master'
      - 'v-*'
      - 'release/*'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore Gradle and Kotlin cache
        id: cache-primes-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .gradle
            .kotlin
          key: ${{ runner.os }}-primes

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle from Properties File
        uses: gradle/actions/setup-gradle@v5

      - name: Build Infrastructure
        run: gradle buildEnvironment --info --build-cache
