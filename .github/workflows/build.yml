# This is a basic workflow to help you get started with Actions

name: 'CI-build'

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - 'main'
      - 'master'
      - 'v-*'
      - 'release/*'

  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fit-bridge-fe
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: fit-bridge-fe/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Run frontend unit tests
        run: npm run test:unit -- --run

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle from Properties File
        uses: gradle/actions/setup-gradle@v5

      - name: Build E2E infrastructure resources
        run: ./gradlew --no-daemon buildInfra --console=plain

      - name: Build backend Docker images
        run: ./gradlew --no-daemon buildImages --console=plain

      - name: Run containerized E2E tests
        run: ./gradlew --no-daemon e2eTests --rerun-tasks --console=plain
