name: 'Training Database Migration'

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle from Properties File
        uses: gradle/actions/setup-gradle@v5

      - name: Build training migration image
        run: ./gradlew --no-daemon :fit-bridge-other:fit-bridge-migration-pg:buildImages --console=plain

      - name: Run training migration
        env:
          LIQUIBASE_COMMAND_URL: ${{ secrets.TRAINING_DB_URL }}
          LIQUIBASE_COMMAND_USERNAME: ${{ secrets.TRAINING_DB_USER }}
          LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.TRAINING_DB_PASSWORD }}
        run: docker run --rm
          -e LIQUIBASE_COMMAND_URL
          -e LIQUIBASE_COMMAND_USERNAME
          -e LIQUIBASE_COMMAND_PASSWORD
          fit-bridge-migration-pg-training:0.1.0
