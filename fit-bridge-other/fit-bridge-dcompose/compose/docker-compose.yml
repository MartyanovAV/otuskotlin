services:
  postgresql:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fitbridge
      POSTGRES_USER: fitbridge
      POSTGRES_PASSWORD: fitbridge-password
      LIQUIBASE_DB_USERNAME: liquibase
      LIQUIBASE_DB_PASSWORD: liquibase-password
      DB_NAME: training_db
      DB_USER: training_user
      DB_PASSWORD: training-password
    volumes:
      - ./volumes/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitbridge -d fitbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase-training:
    image: fit-bridge-migration-pg-training:0.1.0
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgresql:5432/training_db
      LIQUIBASE_COMMAND_USERNAME: liquibase
      LIQUIBASE_COMMAND_PASSWORD: liquibase-password
    depends_on:
      postgresql:
        condition: service_healthy

  training-service:
    image: fitbridge-training-service:local
    depends_on:
      liquibase-training:
        condition: service_completed_successfully
    environment:
      DB_TYPE_PROD: postgres
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: training_db
      DB_USER: training_user
      DB_PASSWORD: training-password
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8081/health/ready > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    volumes:
      - ./volumes/keycloak/import:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'HEAD /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    command:
      - start
      - --import-realm
      - --http-enabled
      - "true"
      - --hostname-strict
      - "true"
      - --hostname
      - "http://localhost:8080"
      - --proxy-headers
      - xforwarded
      - --hostname-backchannel-dynamic
      - "true"

  caddy:
    image: fitbridge-caddy:local
    volumes:
      - ./volumes/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      keycloak:
        condition: service_healthy
      training-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 5s
