services:
  app-base:
    image: nginx:latest
    volumes:
      - ./volumes/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./volumes/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./volumes/nginx/html:/usr/share/nginx/html
    logging:
      driver: "fluentd"
      options:
        fluentd-address: fluent-bit:24224
        tag: app.logs
