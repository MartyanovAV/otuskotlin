openapi: 3.0.3
info:
  title: FitBridge
  description: Trainer-first MVP API v2 с тем же бизнес-scope, что v1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
  - url: http://localhost:8080/v2
tags:
  - name: trainerProfile
    description: Профиль зарегистрированного тренера
  - name: clientCard
    description: Минимальная клиентская карточка тренера
  - name: trainingPlan
    description: Простой тренировочный план и lifecycle публичной ссылки
  - name: dashboard
    description: Сводка кабинета тренера
  - name: publicPlan
    description: Публичный token-only доступ к плану без JWT

paths:
  /trainerProfile/createOrUpdate:
    post:
      tags: [trainerProfile]
      summary: Создать или обновить профиль тренера
      operationId: trainerProfileCreateOrUpdate
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TrainerProfileCreateOrUpdateRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/TrainerProfileCreateOrUpdateResponseBody'
  /trainerProfile/readOwn:
    post:
      tags: [trainerProfile]
      summary: Получить собственный профиль тренера
      operationId: trainerProfileReadOwn
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TrainerProfileReadOwnRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/TrainerProfileReadOwnResponseBody'

  /clientCard/create:
    post:
      tags: [clientCard]
      summary: Создать клиентскую карточку
      operationId: clientCardCreate
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ClientCardCreateRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/ClientCardCreateResponseBody'
  /clientCard/read:
    post:
      tags: [clientCard]
      summary: Прочитать клиентскую карточку
      operationId: clientCardRead
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ClientCardReadRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/ClientCardReadResponseBody'
  /clientCard/update:
    post:
      tags: [clientCard]
      summary: Обновить клиентскую карточку
      operationId: clientCardUpdate
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ClientCardUpdateRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/ClientCardUpdateResponseBody'
  /clientCard/archive:
    post:
      tags: [clientCard]
      summary: Архивировать клиентскую карточку
      operationId: clientCardArchive
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ClientCardArchiveRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/ClientCardArchiveResponseBody'
  /clientCard/list:
    post:
      tags: [clientCard]
      summary: Получить список карточек тренера
      operationId: clientCardList
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ClientCardListRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/ClientCardListResponseBody'

  /trainingPlan/create:
    post:
      tags: [trainingPlan]
      summary: Создать тренировочный план
      operationId: trainingPlanCreate
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TrainingPlanCreateRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/TrainingPlanCreateResponseBody'
  /trainingPlan/read:
    post:
      tags: [trainingPlan]
      summary: Прочитать тренировочный план
      operationId: trainingPlanRead
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TrainingPlanReadRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/TrainingPlanReadResponseBody'
  /trainingPlan/update:
    post:
      tags: [trainingPlan]
      summary: Обновить тренировочный план
      operationId: trainingPlanUpdate
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TrainingPlanUpdateRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/TrainingPlanUpdateResponseBody'
  /trainingPlan/archive:
    post:
      tags: [trainingPlan]
      summary: Архивировать тренировочный план
      operationId: trainingPlanArchive
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TrainingPlanArchiveRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/TrainingPlanArchiveResponseBody'
  /trainingPlan/generatePublicLink:
    post:
      tags: [trainingPlan]
      summary: Сгенерировать публичную ссылку на план
      operationId: trainingPlanGeneratePublicLink
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TrainingPlanGeneratePublicLinkRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/TrainingPlanGeneratePublicLinkResponseBody'
  /trainingPlan/closePublicLink:
    post:
      tags: [trainingPlan]
      summary: Закрыть публичную ссылку на план
      operationId: trainingPlanClosePublicLink
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TrainingPlanClosePublicLinkRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/TrainingPlanClosePublicLinkResponseBody'
  /trainingPlan/readCompletionStatus:
    post:
      tags: [trainingPlan]
      summary: Получить статус выполнения плана
      operationId: trainingPlanReadCompletionStatus
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/TrainingPlanReadCompletionStatusRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/TrainingPlanReadCompletionStatusResponseBody'

  /dashboard/getTrainerSummary:
    post:
      tags: [dashboard]
      summary: Получить сводку кабинета тренера
      operationId: dashboardGetTrainerSummary
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/DashboardGetTrainerSummaryRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/DashboardGetTrainerSummaryResponseBody'

  /public/v2/plan/open:
    post:
      tags: [publicPlan]
      summary: Открыть план по публичному token
      operationId: publicPlanOpenByToken
      servers:
        - url: http://localhost:8080
      security: []
      requestBody:
        $ref: '#/components/requestBodies/PublicPlanOpenByTokenRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/PublicPlanOpenByTokenResponseBody'
  /public/v2/plan/markCompletion:
    post:
      tags: [publicPlan]
      summary: Отметить выполнение элемента плана по публичному token
      operationId: publicPlanMarkCompletion
      servers:
        - url: http://localhost:8080
      security: []
      requestBody:
        $ref: '#/components/requestBodies/PublicPlanMarkCompletionRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/PublicPlanMarkCompletionResponseBody'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  requestBodies:
    TrainerProfileCreateOrUpdateRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrainerProfileCreateOrUpdateRequest'}}}}
    TrainerProfileReadOwnRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrainerProfileReadOwnRequest'}}}}
    ClientCardCreateRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientCardCreateRequest'}}}}
    ClientCardReadRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientCardReadRequest'}}}}
    ClientCardUpdateRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientCardUpdateRequest'}}}}
    ClientCardArchiveRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientCardArchiveRequest'}}}}
    ClientCardListRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientCardListRequest'}}}}
    TrainingPlanCreateRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanCreateRequest'}}}}
    TrainingPlanReadRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanReadRequest'}}}}
    TrainingPlanUpdateRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanUpdateRequest'}}}}
    TrainingPlanArchiveRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanArchiveRequest'}}}}
    TrainingPlanGeneratePublicLinkRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanGeneratePublicLinkRequest'}}}}
    TrainingPlanClosePublicLinkRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanClosePublicLinkRequest'}}}}
    TrainingPlanReadCompletionStatusRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanReadCompletionStatusRequest'}}}}
    DashboardGetTrainerSummaryRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardGetTrainerSummaryRequest'}}}}
    PublicPlanOpenByTokenRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublicPlanOpenByTokenRequest'}}}}
    PublicPlanMarkCompletionRequestBody: {description: Request body, required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublicPlanMarkCompletionRequest'}}}}

  responses:
    TrainerProfileCreateOrUpdateResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/TrainerProfileCreateOrUpdateResponse'}}}}
    TrainerProfileReadOwnResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/TrainerProfileReadOwnResponse'}}}}
    ClientCardCreateResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/ClientCardCreateResponse'}}}}
    ClientCardReadResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/ClientCardReadResponse'}}}}
    ClientCardUpdateResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/ClientCardUpdateResponse'}}}}
    ClientCardArchiveResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/ClientCardArchiveResponse'}}}}
    ClientCardListResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/ClientCardListResponse'}}}}
    TrainingPlanCreateResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanCreateResponse'}}}}
    TrainingPlanReadResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanReadResponse'}}}}
    TrainingPlanUpdateResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanUpdateResponse'}}}}
    TrainingPlanArchiveResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanArchiveResponse'}}}}
    TrainingPlanGeneratePublicLinkResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanGeneratePublicLinkResponse'}}}}
    TrainingPlanClosePublicLinkResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanClosePublicLinkResponse'}}}}
    TrainingPlanReadCompletionStatusResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPlanReadCompletionStatusResponse'}}}}
    DashboardGetTrainerSummaryResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardGetTrainerSummaryResponse'}}}}
    PublicPlanOpenByTokenResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/PublicPlanOpenByTokenResponse'}}}}
    PublicPlanMarkCompletionResponseBody: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/PublicPlanMarkCompletionResponse'}}}}

  schemas:
    IRequest:
      type: object
      description: Базовый интерфейс для всех запросов FitBridge POST Full API
      
      properties:
        requestType:
          type: string
          description: Поле-дискриминатор для вычисления типа запроса
          example: trainerProfile.createOrUpdate
        requestId:
          $ref: '#/components/schemas/RequestId'
        apiVersion:
          type: string
          example: v2
      discriminator:
        propertyName: requestType
        mapping:
          trainerProfile.createOrUpdate: '#/components/schemas/TrainerProfileCreateOrUpdateRequest'
          trainerProfile.readOwn: '#/components/schemas/TrainerProfileReadOwnRequest'
          clientCard.create: '#/components/schemas/ClientCardCreateRequest'
          clientCard.read: '#/components/schemas/ClientCardReadRequest'
          clientCard.update: '#/components/schemas/ClientCardUpdateRequest'
          clientCard.archive: '#/components/schemas/ClientCardArchiveRequest'
          clientCard.list: '#/components/schemas/ClientCardListRequest'
          trainingPlan.create: '#/components/schemas/TrainingPlanCreateRequest'
          trainingPlan.read: '#/components/schemas/TrainingPlanReadRequest'
          trainingPlan.update: '#/components/schemas/TrainingPlanUpdateRequest'
          trainingPlan.archive: '#/components/schemas/TrainingPlanArchiveRequest'
          trainingPlan.generatePublicLink: '#/components/schemas/TrainingPlanGeneratePublicLinkRequest'
          trainingPlan.closePublicLink: '#/components/schemas/TrainingPlanClosePublicLinkRequest'
          trainingPlan.readCompletionStatus: '#/components/schemas/TrainingPlanReadCompletionStatusRequest'
          dashboard.getTrainerSummary: '#/components/schemas/DashboardGetTrainerSummaryRequest'
          publicPlan.openByToken: '#/components/schemas/PublicPlanOpenByTokenRequest'
          publicPlan.markCompletion: '#/components/schemas/PublicPlanMarkCompletionRequest'

    IResponse:
      type: object
      description: Базовый интерфейс для всех ответов FitBridge POST Full API
      
      properties:
        responseType:
          type: string
          description: Поле-дискриминатор для вычисления типа ответа
          example: trainerProfile.createOrUpdate
        requestId:
          $ref: '#/components/schemas/RequestId'
        apiVersion:
          type: string
          example: v2
        result:
          $ref: '#/components/schemas/ResponseResult'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      discriminator:
        propertyName: responseType
        mapping:
          init: '#/components/schemas/InitResponse'
          trainerProfile.createOrUpdate: '#/components/schemas/TrainerProfileCreateOrUpdateResponse'
          trainerProfile.readOwn: '#/components/schemas/TrainerProfileReadOwnResponse'
          clientCard.create: '#/components/schemas/ClientCardCreateResponse'
          clientCard.read: '#/components/schemas/ClientCardReadResponse'
          clientCard.update: '#/components/schemas/ClientCardUpdateResponse'
          clientCard.archive: '#/components/schemas/ClientCardArchiveResponse'
          clientCard.list: '#/components/schemas/ClientCardListResponse'
          trainingPlan.create: '#/components/schemas/TrainingPlanCreateResponse'
          trainingPlan.read: '#/components/schemas/TrainingPlanReadResponse'
          trainingPlan.update: '#/components/schemas/TrainingPlanUpdateResponse'
          trainingPlan.archive: '#/components/schemas/TrainingPlanArchiveResponse'
          trainingPlan.generatePublicLink: '#/components/schemas/TrainingPlanGeneratePublicLinkResponse'
          trainingPlan.closePublicLink: '#/components/schemas/TrainingPlanClosePublicLinkResponse'
          trainingPlan.readCompletionStatus: '#/components/schemas/TrainingPlanReadCompletionStatusResponse'
          dashboard.getTrainerSummary: '#/components/schemas/DashboardGetTrainerSummaryResponse'
          publicPlan.openByToken: '#/components/schemas/PublicPlanOpenByTokenResponse'
          publicPlan.markCompletion: '#/components/schemas/PublicPlanMarkCompletionResponse'

    Error:
      type: object
      properties:
        code: {type: string, example: validation-error}
        group: {type: string, example: validation}
        field: {type: string, example: trainingPlan.title}
        message: {type: string, example: Поле заполнено некорректно}
    ResponseResult:
      type: string
      enum: [success, error]
    RequestId:
      type: string
      description: Идентификатор запроса для трассировки без sensitive payload
    Timestamp:
      type: string
      format: date-time
    UserId: {type: string, description: Внутренний идентификатор зарегистрированного тренера}
    TrainerProfileId: {type: string, description: Идентификатор профиля тренера}
    ClientCardId: {type: string, description: Идентификатор клиентской карточки}
    TrainingPlanId: {type: string, description: Идентификатор тренировочного плана}
    CompletionMarkId: {type: string, description: Идентификатор отметки выполнения}
    Lock: {type: string, description: Версия оптимистичной блокировки}
    PublicToken: {type: string, description: Raw public token; не хранится и не логируется}
    PublicUrl: {type: string, format: uri, description: Публичная ссылка для передачи клиенту}

    TrainerRole: {type: string, enum: [TRAINER]}
    TrainerUserStatus: {type: string, enum: [ACTIVE, BLOCKED, DELETED]}
    TrainerProfileOnboardingStatus: {type: string, enum: [NEW, PROFILE_READY, FIRST_LINK_CREATED, COMPLETED]}
    ClientCardStatus: {type: string, enum: [ACTIVE, ARCHIVED]}
    TrainingPlanStatus: {type: string, enum: [DRAFT, ACTIVE, ARCHIVED]}
    PublicAccessStatus: {type: string, enum: [NONE, ACTIVE, REVOKED, EXPIRED]}
    CompletionStatus: {type: string, enum: [DONE, SKIPPED]}
    CompletionAggregateStatus: {type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, SKIPPED, MIXED]}
    TrainerPermission: {type: string, enum: [read, update, archive, generatePublicLink, closePublicLink, readCompletionStatus]}
    ItemType: {type: string, enum: [EXERCISE, CIRCUIT, SUPERSET]}

    TrainerProfileBase:
      type: object
      properties:
        publicName: {type: string, minLength: 2, maxLength: 80, description: "Имя тренера, безопасное для публичного показа клиенту"}
        specialization: {type: string, maxLength: 120}
    TrainerProfileCreateOrUpdateObject:
      type: object
      properties:
        publicName: {type: string, minLength: 2, maxLength: 80, description: "Имя тренера, безопасное для публичного показа клиенту"}
        specialization: {type: string, maxLength: 120}
    TrainerProfileResponseObject:
      type: object
      properties:
        publicName: {type: string, minLength: 2, maxLength: 80, description: "Имя тренера, безопасное для публичного показа клиенту"}
        specialization: {type: string, maxLength: 120}
        id: {$ref: '#/components/schemas/TrainerProfileId'}
        userId: {$ref: '#/components/schemas/UserId'}
        role: {$ref: '#/components/schemas/TrainerRole'}
        userStatus: {$ref: '#/components/schemas/TrainerUserStatus'}
        onboardingStatus: {$ref: '#/components/schemas/TrainerProfileOnboardingStatus'}
        lock: {$ref: '#/components/schemas/Lock'}

    ClientCardBase:
      type: object
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120, description: Имя или псевдоним клиента для тренера}
        note: {type: string, maxLength: 1000, description: Внутренняя заметка тренера; не попадает в public payload}
    ClientCardCreateObject:
      type: object
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120, description: Имя или псевдоним клиента для тренера}
        note: {type: string, maxLength: 1000, description: Внутренняя заметка тренера; не попадает в public payload}
    ClientCardReadObject:
      type: object
      properties: {id: {$ref: '#/components/schemas/ClientCardId'}}
    ClientCardUpdateObject:
      type: object
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120, description: Имя или псевдоним клиента для тренера}
        note: {type: string, maxLength: 1000, description: Внутренняя заметка тренера; не попадает в public payload}
        id: {$ref: '#/components/schemas/ClientCardId'}
        lock: {$ref: '#/components/schemas/Lock'}
    ClientCardArchiveObject:
      type: object
      properties: {id: {$ref: '#/components/schemas/ClientCardId'}, lock: {$ref: '#/components/schemas/Lock'}}
    ClientCardListFilter:
      type: object
      properties:
        searchString: {type: string, maxLength: 120}
        status: {$ref: '#/components/schemas/ClientCardStatus'}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        pageNumber: {type: integer, minimum: 1}
    ClientCardResponseObject:
      type: object
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120, description: Имя или псевдоним клиента для тренера}
        note: {type: string, maxLength: 1000, description: Внутренняя заметка тренера; не попадает в public payload}
        id: {$ref: '#/components/schemas/ClientCardId'}
        status: {$ref: '#/components/schemas/ClientCardStatus'}
        lastPlanStatus: {$ref: '#/components/schemas/TrainingPlanStatus'}
        lastCompletionStatus: {$ref: '#/components/schemas/CompletionAggregateStatus'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
        lock: {$ref: '#/components/schemas/Lock'}

    PlanItem:
      type: object
      discriminator:
        propertyName: itemType
        mapping:
          EXERCISE: '#/components/schemas/ExerciseItem'
          CIRCUIT: '#/components/schemas/CircuitItem'
          SUPERSET: '#/components/schemas/SupersetItem'
      properties:
        id: {type: string, format: uuid, description: Уникальный идентификатор элемента}
        itemType:
          $ref: '#/components/schemas/ItemType'
        title: {type: string, maxLength: 160, example: Приседания}
        description: {type: string, maxLength: 2000, description: Текст задания}

    ExerciseSet:
      type: object
      properties:
        reps: {type: string, example: 10-12}
        weight: {type: string, example: 20}
        weightUnit: {type: string, example: KG}
        durationSeconds: {type: integer, example: 60}

    ExerciseItem:
      allOf:
        - $ref: '#/components/schemas/PlanItem'
        - type: object
          properties:
            exerciseId: {type: string, description: Идентификатор словарного упражнения}
            sets:
              type: array
              items: {$ref: '#/components/schemas/ExerciseSet'}
            restBetweenSetsSeconds: {type: integer}

    CircuitItem:
      allOf:
        - $ref: '#/components/schemas/PlanItem'
        - type: object
          properties:
            rounds: {type: integer}
            items:
              type: array
              items: {$ref: '#/components/schemas/PlanItem'}
            restBetweenRoundsSeconds: {type: integer}

    SupersetItem:
      allOf:
        - $ref: '#/components/schemas/PlanItem'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/PlanItem'}
            restBetweenSetsSeconds: {type: integer}
    TrainingPlanBase:
      type: object
      properties:
        title: {type: string, minLength: 3, maxLength: 120}
        planItems:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PlanItem'}
    TrainingPlanCreateObject:
      type: object
      properties:
        title: {type: string, minLength: 3, maxLength: 120}
        planItems:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PlanItem'}
        clientCardId: {$ref: '#/components/schemas/ClientCardId'}
    TrainingPlanReadObject:
      type: object
      properties: {id: {$ref: '#/components/schemas/TrainingPlanId'}}
    TrainingPlanUpdateObject:
      type: object
      properties:
        title: {type: string, minLength: 3, maxLength: 120}
        planItems:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PlanItem'}
        id: {$ref: '#/components/schemas/TrainingPlanId'}
        lock: {$ref: '#/components/schemas/Lock'}
    TrainingPlanArchiveObject:
      type: object
      properties: {id: {$ref: '#/components/schemas/TrainingPlanId'}, lock: {$ref: '#/components/schemas/Lock'}}
    TrainingPlanGeneratePublicLinkObject:
      type: object
      properties: {id: {$ref: '#/components/schemas/TrainingPlanId'}, expiresAt: {$ref: '#/components/schemas/Timestamp'}}
    TrainingPlanClosePublicLinkObject:
      type: object
      properties: {id: {$ref: '#/components/schemas/TrainingPlanId'}, lock: {$ref: '#/components/schemas/Lock'}}
    TrainingPlanReadCompletionStatusObject:
      type: object
      properties: {id: {$ref: '#/components/schemas/TrainingPlanId'}}
    CompletionMarkResponseObject:
      type: object
      properties:
        id: {$ref: '#/components/schemas/CompletionMarkId'}
        itemId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/CompletionStatus'}
        completedAt: {$ref: '#/components/schemas/Timestamp'}
        clientComment: {type: string, maxLength: 500}
    CompletionSummary:
      type: object
      properties:
        aggregateStatus: {$ref: '#/components/schemas/CompletionAggregateStatus'}
