[PARSER]
  Name   nginx_parser
  Format regex
  Regex  ^access_log (?<remote_address>[^ ]*) "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<status>[^ ]*) "(?<http_user_agent>[^\"]*)"
  Types  status:integer

[PARSER]
  Name        json
  Format      json
  Time_Key    @timestamp
  Time_Format %Y-%m-%dT%H:%M:%S.%L%z

[PARSER]
  Name        logback
  Format      regex
  Regex       ^(?<log_time>\d{2}:\d{2}:\d{2}\.\d{3})\s+\[(?<thread>[^\]]+)\]\s+(?<level>[A-Z]+)\s+(?<logger>\S+)\s+-+\s+(?<message>.*)$

