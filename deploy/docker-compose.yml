# Минимальная инфраструктура FitBridge:
# PostgreSQL, GreptimeDB, Fluent Bit, Envoy, Keycloak and Ktor services.

services:
  postgresql:
    image: postgres:18-alpine
    container_name: postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-password}
      KC_DB_NAME: ${KC_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak-password}
      LIQUIBASE_DB_USERNAME: ${LIQUIBASE_DB_USERNAME:-liquibase}
      LIQUIBASE_DB_PASSWORD: ${LIQUIBASE_DB_PASSWORD:-liquibase-password}
      DB_NAME: ${DB_NAME:-training_db}
      DB_USER: ${DB_USER:-training_user}
      DB_PASSWORD: ${DB_PASSWORD:-training-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql
      - ./volumes/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fitbridge-network

  liquibase-training:
    image: fit-bridge-migration-pg-training:${APP_VERSION:-0.1.0}
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgresql:5432/${DB_NAME:-training_db}
      LIQUIBASE_COMMAND_USERNAME: ${LIQUIBASE_DB_USERNAME:-liquibase}
      LIQUIBASE_COMMAND_PASSWORD: ${LIQUIBASE_DB_PASSWORD:-liquibase-password}
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - fitbridge-network

  training-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args:
        SERVICE_NAME: training-service
        SERVICE_PORT: 8081
    image: fitbridge-training-service:${APP_VERSION:-local}
    depends_on:
      liquibase-training:
        condition: service_completed_successfully
      fluent-bit:
        condition: service_started
      envoy:
        condition: service_healthy
    environment:
      DB_TYPE_PROD: postgres
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-training_db}
      DB_USER: ${DB_USER:-training_user}
      DB_PASSWORD: ${DB_PASSWORD:-training-password}
    logging:
      driver: "fluentd"
      options:
        fluentd-address: 127.0.0.1:24224
        tag: training.logs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8081/health/ready > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - fitbridge-network

  frontend:
    build:
      context: ../fit-bridge-fe
      dockerfile: Dockerfile
    image: fitbridge-frontend:local
    environment:
      FITBRIDGE_API_BASE_URL: /v2
      FITBRIDGE_KEYCLOAK_URL: ${FITBRIDGE_PUBLIC_URL:-http://localhost:8080}
      FITBRIDGE_KEYCLOAK_REALM: fit-bridge
      FITBRIDGE_KEYCLOAK_CLIENT_ID: fit-bridge-web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - fitbridge-network

  fluent-bit:
    container_name: fluent-bit
    image: fluent/fluent-bit:4.2.0
    depends_on:
      greptimedb:
        condition: service_healthy
    ports:
      - "127.0.0.1:24224:24224"
      - "127.0.0.1:24224:24224/udp"
      - "127.0.0.1:2020:2020"
    environment:
      - greptimedb_host=greptimedb
      - greptimedb_user=${GREPTIMEDB_USER:-admin}
      - greptimedb_pass=${GREPTIMEDB_PASS:-admin}
    volumes:
      - ./volumes/fluent-bit-etc/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./volumes/fluent-bit-etc/parsers.conf:/fluent-bit/etc/parsers.conf
    networks:
      - fitbridge-network

  greptimedb:
    container_name: greptimedb
    image: greptime/greptimedb:v1.1.4
    command:
      - standalone
      - start
      - --http-addr
      - 0.0.0.0:4000
      - --rpc-bind-addr
      - 0.0.0.0:4001
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:4002:4002"
      - "127.0.0.1:4003:4003"
    volumes:
      - greptimedb-data:/tmp/greptimedb/
    healthcheck:
      test: ["CMD-SHELL", "status=$$(/usr/bin/curl --silent --show-error --output /dev/null --write-out '%{response_code}' --request GET http://127.0.0.1:4000/health) && [ \"$$status\" = 200 ]"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - fitbridge-network

  envoy:
    image: envoyproxy/envoy:v1.29.0
    volumes:
      - ./volumes/envoy/envoy.yaml:/etc/envoy/envoy.yaml
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      frontend:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    logging:
      driver: "fluentd"
      options:
        fluentd-address: 127.0.0.1:24224
        tag: envoy.logs
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/15001; printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - fitbridge-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    volumes:
      - ./volumes/keycloak/import:/opt/keycloak/data/import
      - ./volumes/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql:5432/${KC_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak-password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'HEAD /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n' >&3;cat <&3" ]
      interval: 10s
      timeout: 5s
      retries: 15
    command:
      - start-dev
      - --import-realm
      - --hostname-strict
      - "false"
      - --hostname
      - "${FITBRIDGE_PUBLIC_URL:-http://localhost:8080}"
      - --proxy-headers
      - forwarded
      - --hostname-backchannel-dynamic
      - "true"
    networks:
      - fitbridge-network

volumes:
  greptimedb-data:
  postgresql-data:

networks:
  fitbridge-network:
    driver: bridge
