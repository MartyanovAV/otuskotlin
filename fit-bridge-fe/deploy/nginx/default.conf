server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"frontend"}';
    }

    # Runtime settings must never be cached: the same image is used in test and production.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files /config.js =404;
    }

    location = /config.template.js {
        return 404;
    }

    # A stale service worker can keep serving an obsolete SPA bundle and break
    # OIDC routes after deployment. Always revalidate the worker and registrar.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
